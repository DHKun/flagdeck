id = "wafw00f"
name = "wafw00f"
category = "http"
tier = "tier_1"
capabilities = ["waf_fingerprint"]
aliases = ["WAF 识别", "防火墙指纹", "wafw00f", "CDN 识别"]
risk_level = "l2"
summary = "识别目标站前 WAF / CDN（PATH）"

usage = """
【FlagDeck 表单】
• 必填：目标 URL
• 可选：找全匹配、不重定向、代理、超时、指定 WAF、输出文件
• 输出：任务目录 wafw00f.json

完整帮助：wafw00f -h
"""
mode = "embedded_cli"
featured = true

[[presets]]
id = "quick_fingerprint"
name = "快速指纹"
core_fields = ["url"]

[presets.defaults]
findall = "no"
noredirect = "yes"
verbose = "no"
save_json = "yes"

[[presets]]
id = "full_match"
name = "找全匹配"
core_fields = ["url", "findall"]

[presets.defaults]
findall = "yes"
noredirect = "yes"
verbose = "no"
save_json = "yes"

[[presets]]
id = "via_proxy"
name = "经代理识别"
core_fields = ["url", "proxy", "timeout"]

[presets.defaults]
findall = "no"
noredirect = "yes"
proxy = "http://127.0.0.1:8080"
timeout = "20"
verbose = "no"
save_json = "yes"

[[field_groups]]
id = "target"
name = "目标"
fields = ["url", "test_waf"]

[[field_groups]]
id = "request"
name = "请求"
fields = ["proxy", "headers_file", "timeout"]

[[field_groups]]
id = "execution"
name = "执行"
fields = ["findall", "noredirect", "verbose", "save_json"]

[io]
schema_version = 1

[[io.inputs]]
id = "target"
kind = "url"
field = "url"

[[io.outputs]]
id = "waf_detection"
kind = "http_discovery"

[[io.outputs]]
id = "raw_output"
kind = "raw_artifact"

[installation]
distribution = "hybrid"
license = "BSD-3-Clause"
homepage = "https://github.com/EnableSecurity/wafw00f"
version = "2.4.2"
health_strategy = "safe-version-command"
runtime = "Python (pipx)"
version_args = ["-v"]
install_command = "pipx install wafw00f"
path_fix = "export PATH=\"$PATH:$HOME/.local/bin\""
wordlist_source = ""
wordlist_install_command = ""

[binary]
command = "wafw00f"
path = ""
resolve = ["system"]

[ui]
icon = "shield"
accent = "orange"

[[form.fields]]
id = "url"
type = "url"
label = "目标 URL"
required = true
from = "target_url"
hint = "站点首页或任意可访问页面，例 https://example.com/"

[[form.fields]]
id = "findall"
type = "select"
label = "找全部匹配 -a"
default = "no"
options = ["no", "yes"]
required = true
hint = "yes=不在第一个匹配处停止，尽量枚举所有命中的 WAF 签名（更慢）"

[[form.fields]]
id = "noredirect"
type = "select"
label = "不跟随重定向 -r"
default = "no"
options = ["no", "yes"]
required = true
hint = "yes=忽略 3xx 跳转，只测当前 URL（避免跳到 CDN 首页干扰）"

[[form.fields]]
id = "proxy"
type = "text"
sensitive = true
label = "代理 -p（可选）"
default = ""
required = false
hint = "HTTP/SOCKS 代理，例 http://127.0.0.1:8080 或 socks5://127.0.0.1:1080"

[[form.fields]]
id = "timeout"
type = "number"
label = "超时 -T 秒（可选）"
default = ""
required = false
hint = "单次请求超时；目标慢或跨国时可加大"

[[form.fields]]
id = "test_waf"
type = "text"
label = "只测指定 WAF -t（可选）"
default = ""
required = false
hint = "限定一种产品名（见 wafw00f -l 列表）；带空格时需与官方名称一致"

[[form.fields]]
id = "headers_file"
type = "text"
label = "自定义头文件 -H（可选）"
default = ""
required = false
hint = "文本文件绝对路径，覆盖默认请求头集合"

[[form.fields]]
id = "verbose"
type = "select"
label = "详细输出 -v"
default = "no"
options = ["no", "yes"]
required = true
hint = "yes=打印更多探测细节，便于判断误报"

[[form.fields]]
id = "save_json"
type = "select"
label = "结果写任务目录 JSON"
default = "yes"
options = ["yes", "no"]
required = true
hint = "yes= -o 任务目录/wafw00f.json，便于留存"

[argv]
template = ["{url}"]

[[argv.optional]]
field = "findall"
equals = "yes"
args = ["-a"]

[[argv.optional]]
field = "noredirect"
equals = "yes"
args = ["-r"]

[[argv.optional]]
field = "proxy"
args = ["-p", "{proxy}"]

[[argv.optional]]
field = "timeout"
args = ["-T", "{timeout}"]

[[argv.optional]]
field = "test_waf"
args = ["-t", "{test_waf}"]

[[argv.optional]]
field = "headers_file"
args = ["-H", "{headers_file}"]

[[argv.optional]]
field = "verbose"
equals = "yes"
args = ["-v"]

[[argv.optional]]
field = "save_json"
equals = "yes"
args = ["-o", "{job_dir}/wafw00f.json", "-f", "json"]

[parser]
kind = "wafw00f-json"
id = "flagdeck.wafw00f-json"
version = "1.0.0"

[limits]
timeout_millis = 300000
memory_max_bytes = 268435456
