id = "fscan"
name = "fscan"
category = "fingerprint"
tier = "tier_1"
capabilities = ["host_discovery", "service_discovery", "web_fingerprint"]
aliases = ["内网扫描", "主机发现", "端口扫描", "fscan"]
risk_level = "l2"
summary = "主机/端口/服务扫描（Active/fscan）"

usage = """
【FlagDeck 表单】
• 必填：主机 -h、端口 -p、模式 -m
• 可选：禁 ping/POC/爆破、Cookie、排除主机/端口、代理、线程、超时
• 输出：任务目录 fscan-output.json

完整帮助：fscan -help
仅限授权内网/靶场。
"""
mode = "embedded_cli"
featured = true
platforms = ["linux"]

[[presets]]
id = "web_ports"
name = "Web 端口扫描"
core_fields = ["host", "ports", "mode"]

[presets.defaults]
ports = "80,443,8080,8000,8443"
mode = "all"
output_format = "json"
no_ping = "no"
no_poc = "yes"
no_brute = "yes"
global_timeout = "3"

[[presets]]
id = "alive_only"
name = "仅存活探测"
core_fields = ["host", "ports", "mode", "alive_only"]

[presets.defaults]
ports = "80,443"
mode = "icmp"
output_format = "json"
alive_only = "yes"
no_poc = "yes"
no_brute = "yes"
global_timeout = "3"

[[presets]]
id = "full_service"
name = "完整服务扫描"
core_fields = ["host", "ports", "mode", "module_threads"]

[presets.defaults]
ports = "22,80,443,3389,3306,6379,8080,8000,8443"
mode = "all"
output_format = "json"
no_ping = "no"
no_poc = "no"
no_brute = "yes"
module_threads = "100"
global_timeout = "5"

[[field_groups]]
id = "target"
name = "目标"
fields = ["host", "ports", "mode", "exclude_hosts", "exclude_ports"]

[[field_groups]]
id = "request"
name = "请求"
fields = ["cookie", "proxy", "domain", "iface"]

[[field_groups]]
id = "execution"
name = "执行"
fields = ["no_ping", "alive_only", "no_poc", "no_brute", "full_poc", "module_threads", "global_timeout", "output_format"]

[io]
schema_version = 1

[[io.inputs]]
id = "target"
kind = "url"
field = "host"

[[io.outputs]]
id = "discoveries"
kind = "http_discovery"

[[io.outputs]]
id = "raw_output"
kind = "raw_artifact"

[installation]
distribution = "hybrid"
license = "GPL-3.0"
homepage = "https://github.com/shadow1ng/fscan"
version = "2.1.3"
health_strategy = "safe-version-command"
runtime = "standalone Go binary"
version_args = ["-h"]
install_command = "下载 Active/fscan 发布包到 tools root"
path_fix = "export PATH=\"$PATH:/data/CTF/Tools/Active/fscan\""
wordlist_source = ""
wordlist_install_command = ""

[binary]
command = "fscan"
path = "Active/fscan/fscan_2.1.3_linux_x64"
resolve = ["tools_root", "path", "system"]

[ui]
icon = "scan"
accent = "teal"

[[form.fields]]
id = "host"
type = "host"
label = "目标主机 -h"
required = true
from = "target_url"
hint = "IP、IP 段、域名；也可填主机列表文件路径（见 -hf）"

[[form.fields]]
id = "ports"
type = "text"
label = "端口 -p"
default = "80,443,8080,8000,8443,22,3389,3306,6379"
required = true
hint = "逗号分隔端口/范围；决定扫哪些服务"

[[form.fields]]
id = "mode"
type = "select"
label = "扫描模式 -m"
default = "all"
options = ["all", "icmp"]
required = true
hint = "all=完整流程；icmp=仅存活探测"

[[form.fields]]
id = "no_ping"
type = "select"
label = "禁用 ping -np"
default = "yes"
options = ["yes", "no"]
required = true
hint = "yes=不先 ICMP，直接端口扫（禁 ping 环境/loopback 建议 yes）"

[[form.fields]]
id = "alive_only"
type = "select"
label = "仅存活探测 -ao"
default = "no"
options = ["no", "yes"]
required = true
hint = "yes=只判断主机是否存活，不继续端口/服务"

[[form.fields]]
id = "no_poc"
type = "select"
label = "禁用 POC -nopoc"
default = "yes"
options = ["yes", "no"]
required = true
hint = "yes=不做漏洞 POC（更安全、更安静）"

[[form.fields]]
id = "no_brute"
type = "select"
label = "禁用爆破 -nobr"
default = "yes"
options = ["yes", "no"]
required = true
hint = "yes=关闭弱口令爆破模块"

[[form.fields]]
id = "full_poc"
type = "select"
label = "全量 POC -full"
default = "no"
options = ["no", "yes"]
required = true
hint = "yes=跑全量 POC，更慢更吵；默认关"

[[form.fields]]
id = "cookie"
type = "text"
sensitive = true
label = "HTTP Cookie（可选）"
default = ""
required = false
hint = "Web 探测时带上的 Cookie（已登录后台）"

[[form.fields]]
id = "exclude_hosts"
type = "text"
label = "排除主机 -eh（可选）"
default = ""
required = false
hint = "不扫这些主机，逗号分隔"

[[form.fields]]
id = "exclude_ports"
type = "text"
label = "排除端口 -ep（可选）"
default = ""
required = false
hint = "从端口集中排除，例 1-1000"

[[form.fields]]
id = "module_threads"
type = "number"
label = "模块线程 -mt（可选）"
default = ""
required = false
hint = "各模块并发线程，默认约 20"

[[form.fields]]
id = "output_format"
type = "select"
label = "输出格式 -f"
default = "json"
options = ["json", "txt", "csv"]
required = true
hint = "结果文件格式；json 便于后续解析"

[[form.fields]]
id = "global_timeout"
type = "number"
label = "全局超时秒 -gt"
default = "120"
required = true
hint = "整次任务超时上限"

[[form.fields]]
id = "proxy"
type = "text"
sensitive = true
label = "HTTP 代理 -proxy（可选）"
default = ""
required = false
hint = "部分 HTTP 模块可走代理"

[[form.fields]]
id = "iface"
type = "text"
label = "本地网卡 IP -iface（可选）"
default = ""
required = false
hint = "VPN 场景绑定源地址，例 10.8.0.5"

[[form.fields]]
id = "domain"
type = "text"
label = "域名 -domain（可选）"
default = ""
required = false
hint = "部分插件需要的域名上下文"

[argv]
template = [
  "-h",
  "{host}",
  "-p",
  "{ports}",
  "-m",
  "{mode}",
  "-f",
  "{output_format}",
  "-o",
  "{job_dir}/fscan-output.{output_format}",
  "-gt",
  "{global_timeout}",
  "-nocolor",
  "-nopg",
]

[[argv.optional]]
field = "no_ping"
equals = "yes"
args = ["-np"]

[[argv.optional]]
field = "alive_only"
equals = "yes"
args = ["-ao"]

[[argv.optional]]
field = "no_poc"
equals = "yes"
args = ["-nopoc"]

[[argv.optional]]
field = "no_brute"
equals = "yes"
args = ["-nobr"]

[[argv.optional]]
field = "full_poc"
equals = "yes"
args = ["-full"]

[[argv.optional]]
field = "cookie"
args = ["-cookie", "{cookie}"]

[[argv.optional]]
field = "exclude_hosts"
args = ["-eh", "{exclude_hosts}"]

[[argv.optional]]
field = "exclude_ports"
args = ["-ep", "{exclude_ports}"]

[[argv.optional]]
field = "module_threads"
args = ["-mt", "{module_threads}"]

[[argv.optional]]
field = "proxy"
args = ["-proxy", "{proxy}"]

[[argv.optional]]
field = "iface"
args = ["-iface", "{iface}"]

[[argv.optional]]
field = "domain"
args = ["-domain", "{domain}"]

[parser]
kind = "fscan-json"
id = "flagdeck.fscan-json"
version = "1.0.0"

[limits]
timeout_millis = 600000
memory_max_bytes = 536870912
