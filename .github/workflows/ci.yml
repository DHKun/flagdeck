name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync dependencies
        run: mise run sync-all

      - name: Prepare generated release resources
        run: |
          mise run stage-host-runtime
          mise run r7-sbom

      - name: Run checks
        run: mise run test-all

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-audit
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore locked audit tools
        uses: actions/cache@v4
        with:
          path: .release-tools
          key: release-tools-${{ runner.os }}-${{ hashFiles('scripts/run_release_audits.py') }}

      - name: Sync dependencies
        run: mise run sync-all

      - name: Audit production dependencies
        run: mise run r7-audits
